name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch lint config
        run: |
          curl -fsSL https://raw.githubusercontent.com/Syzygy-Hub/.github/main/engineering/tooling/rn/.eslintrc.ts.json \
            -o .eslintrc.json
          curl -fsSL https://raw.githubusercontent.com/Syzygy-Hub/.github/main/engineering/tooling/rn/.prettierrc \
            -o .prettierrc

      - name: Install
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm test -- --coverage --coverageReporters=text-summary 2>&1 | tee /tmp/jest-output.txt

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: warn

      - name: Coverage summary
        run: |
          {
            echo "## Coverage Report"
            echo "\`\`\`"
            grep -A20 "Coverage summary" /tmp/jest-output.txt || echo "No coverage summary found."
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
